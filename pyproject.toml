[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reader3"
version = "1.10.0"
description = "Simple EPUB reader web app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "ebooklib>=0.20",
    "fastapi>=0.162.0,<0.163",
    "starlette>=1.10.0,<2",
    "jinja2>=3.1.6",
    "httptools>=0.6.1",
    "uvicorn>=0.38.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "orjson>=3.10.11",
    "python-multipart>=0.0.32,<0.1",
    "pymupdf>=1.28.2,<2",
    "lxml>=6.1.3,<7",
    "nh3>=0.3.6,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
build = [
    "pyinstaller>=6.22.3,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.setuptools.package-data]
reader3 = [
    "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]
