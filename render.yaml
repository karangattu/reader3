services:
  - type: web
    name: reader3
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: >-
      uvicorn reader3.app:app
      --host 0.0.0.0
      --port $PORT
      --workers ${WEB_CONCURRENCY:-1}
      --timeout-keep-alive 30
      --limit-concurrency 100
      --log-level info
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOOKS_DIR
        value: /var/data/books
      - key: READER3_BOOKS_DIR
        value: /var/data/books
      - key: WEB_CONCURRENCY
        value: "1"
      - key: IO_WORKERS
        value: "4"
      - key: PDF_JOB_WORKERS
        value: "1"
      - key: PDF_MAX_QUEUE
        value: "4"
      - key: PDF_COPY_CACHE_MAX_MB
        value: "512"
      - key: BOOK_CACHE_MAX_MB
        value: "128"
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: LOG_LEVEL
        value: info
    disk:
      name: reader_data
      mountPath: /var/data
      sizeGB: 2
